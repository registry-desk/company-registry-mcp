name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ["*/server.json"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      # Publish only the servers whose server.json changed in this push, because the
      # registry rejects a version that is already published. Manual runs publish both.
      - name: Publish changed servers
        run: |
          for dir in uk-companies-house fr-sirene; do
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^ HEAD -- "$dir/server.json"; then
              echo "Publishing $dir"
              (cd "$dir" && ../mcp-publisher publish)
            else
              echo "Skipping $dir (server.json unchanged)"
            fi
          done
